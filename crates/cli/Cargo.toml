[package]
name = "patchtrack"
description = "Track patch series on mailing lists, like pull requests: the CLI and TUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["email", "patch", "git", "lore", "kernel"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
patchtrack-core = { workspace = true, features = ["serde"] }
patchtrack-store.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json = "1"
# Blocking HTTP over rustls: the sync loop needs one request at a time, no runtime.
ureq = "3"
# The default browser, on Linux, Windows and macOS alike (`open`).
open = "5"
# How wide the terminal is, for `list`'s columns.
terminal_size = "0.4"
# Unicode \w, \s, \b and case folding, as Python's re has them; not the
# \p{...} tables, which no pattern uses.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
# The TUI: ratatui over crossterm, which also drives Windows consoles.
ratatui = "0.30.2"
dirs = "6"
# The bridge's pairing token (ring already depends on it).
getrandom = "0.2"
