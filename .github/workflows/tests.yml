name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (no network; git is used for the tree and branch tests)
        run: PYTHONPATH=src:tests python -m unittest discover -s tests -v
      - name: Install and run the command
        run: |
          pip install .
          patchtrack --version
          patchtrack --help
