name: release

# Publishes to PyPI when a GitHub release is published, through PyPI's
# Trusted Publishing (OpenID Connect): no API token is stored anywhere.
# PyPI must list this repository, this workflow and the "pypi" environment
# as a trusted publisher of the patchtrack project.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: The release tag matches the package version
        run: |
          version=$(python -c 'import sys; sys.path.insert(0, "src"); import patchtrack; print(patchtrack.__version__)')
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME, version $version"; exit 1; }
      - name: Tests
        run: PYTHONPATH=src:tests python -m unittest discover -s tests
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/patchtrack/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
