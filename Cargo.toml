[workspace]
resolver = "3"
members = ["crates/core", "crates/store", "crates/cli"]

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/ryanabx/patchtrack"
homepage = "https://ryanabx.github.io/patchtrack"

[workspace.dependencies]
# Versions too, so the crates that depend on these can be published.
patchtrack-core = { path = "crates/core", version = "0.2.0-dev" }
patchtrack-store = { path = "crates/store", version = "0.2.0-dev" }
